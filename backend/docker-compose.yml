services:
  researchpilot-api:
    build: .
    container_name: researchpilot-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    volumes:
      - researchpilot-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  researchpilot-data:
